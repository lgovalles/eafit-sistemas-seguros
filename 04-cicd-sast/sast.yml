name: SAST (Semgrep)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  semgrep:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep (community rulesets + reglas propias del proyecto)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --config .semgrep/custom-rules.yml \
            --exclude "frontend/node_modules" \
            --exclude "node_modules" \
            --exclude "test" \
            --exclude "cypress" \
            --exclude "data/static/codefixes" \
            --severity ERROR \
            --error \
            --sarif --output semgrep-results.sarif

      - name: Subir resultados SARIF (visibles en la pestaña Security)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

      - name: Publicar resumen como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.sarif
